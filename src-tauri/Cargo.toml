[package]
name = "tamp"
# Kept in lockstep with package.json (the single source of version truth) by
# `bun run sync-version`; CI also enforces a match. Do not hand-edit.
version = "0.3.0"
description = "Shrink screen recordings to a target size, right from your menu bar."
authors = ["Valerii Maslenykov"]
license = "MIT"
repository = "https://github.com/ValeriyMaslenikov/tamp"
edition = "2021"
# MSRV-aware dependency resolution: the local toolchain is rustc 1.85, but
# several transitive deps' latest releases require 1.86+.
rust-version = "1.85"
resolver = "3"

[lib]
name = "tamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api stays in the base features and macOSPrivateApi in the
# base tauri.conf.json: tauri-build enforces feature ↔ flag equality on the
# MERGED config of whichever platform is building. Both are inert outside
# macOS.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time"] }
thiserror = "2"
trash = "5"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Free space on the output volume, logged when an encode attempt fails.
fs4 = "0.13"
# Minimal blocking HTTP client for the opt-in GitHub update check. We use the
# OS-native TLS (`native-tls` → SChannel on Windows, Security.framework on
# macOS) rather than rustls: rustls' crypto providers (ring / aws-lc-rs) need a
# C/clang toolchain to build their aarch64 assembly, which isn't available on
# the aarch64-pc-windows-msvc target this must compile for. native-tls keeps us
# clear of OpenSSL on every platform tamp ships (Windows + macOS) while staying
# a tiny blocking client. `json` parses the releases list into serde_json.
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
# Parses and orders release tags (incl. prerelease ordering) for "is there a
# newer version?" without hand-rolling semver comparison.
semver = "1"

[target.'cfg(target_os = "windows")'.dependencies]
# CF_HDROP file lists — pasting outputs as files into Explorer/chat apps.
clipboard-win = "5"
# Reads the taskbar light/dark theme (SystemUsesLightTheme) so the tray icon
# is drawn in a contrasting ink rather than a fixed white that vanishes on a
# light taskbar.
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSResponder", "NSWindow", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSEnumerator"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
