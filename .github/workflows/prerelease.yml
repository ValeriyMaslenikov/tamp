name: Beta release

# Beta tags (vX.Y.Z-beta.N) can be pushed from any branch: tag-push events run
# the workflow file at the tagged commit, so this needs nothing on main.
on:
  push:
    tags: ["v*-beta*"]

permissions:
  contents: write

jobs:
  create-release:
    name: Create prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Create-if-absent with loud failures. The previous `gh release create ...
      # || echo "release already exists"` masked EVERY error (auth, API outage,
      # malformed notes, tag mismatch) as a green step, after which the build
      # job's `gh release upload --clobber` either failed confusingly or
      # clobbered a stale same-named release. Instead we explicitly probe for an
      # existing release with `gh release view` and only `create` when it is
      # absent; `set -euo pipefail` makes any other (real) failure surface red.
      # Re-pushing the same beta tag intentionally reuses the existing release
      # so the build job's --clobber refreshes its assets (no duplicate / stale
      # release); a genuine create failure with no existing release is no longer
      # swallowed. Notes come from the CHANGELOG.md entry for this version (the
      # `## X.Y.Z` section), falling back to a generic line for betas that have
      # no changelog entry yet; the unsigned-binary bypass note is always kept
      # as a footer.
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Reuse an existing release for a re-pushed tag; surface any other
          # `gh release view` failure (auth/API) instead of hiding it. `view`
          # exits non-zero only when the release is absent, so we capture stderr
          # and re-raise unless it is the expected "release not found" case.
          if view_err=$(gh release view "$GITHUB_REF_NAME" 2>&1 >/dev/null); then
            echo "Release $GITHUB_REF_NAME already exists; reusing it."
            exit 0
          elif ! grep -qi 'release not found\|not found' <<<"$view_err"; then
            echo "::error::Unexpected failure querying release $GITHUB_REF_NAME:" >&2
            echo "$view_err" >&2
            exit 1
          fi

          # Build release notes from CHANGELOG.md. The tag is vX.Y.Z-beta.N, so
          # the base version (X.Y.Z) is the changelog heading to match; for a
          # beta with no entry yet this finds nothing and we fall back.
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${VERSION%%-*}"
          NOTES_FILE="$(mktemp)"
          FOOTER='Unsigned binaries — see the README install notes for the Gatekeeper/SmartScreen bypass.'

          # Extract the `## <version>` section body, stopping at the next
          # `## ` heading. Try the full tag version first, then the base version.
          extract_changelog() {
            awk -v ver="$1" '
              $0 == "## " ver { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
          }
          CHANGELOG_BODY="$(extract_changelog "$VERSION")"
          if [ -z "${CHANGELOG_BODY//[$'\n\t ']/}" ]; then
            CHANGELOG_BODY="$(extract_changelog "$BASE_VERSION")"
          fi

          if [ -n "${CHANGELOG_BODY//[$'\n\t ']/}" ]; then
            printf '%s\n' "$CHANGELOG_BODY" >"$NOTES_FILE"
          else
            printf 'Beta build.\n' >"$NOTES_FILE"
          fi
          printf '\n---\n\n%s\n' "$FOOTER" >>"$NOTES_FILE"

          gh release create "$GITHUB_REF_NAME" --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE"

  build:
    name: Build (${{ matrix.os }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundle-glob: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle-glob: src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: windows-11-arm
            bundle-glob: src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # macOS signing + notarization read these during `bun tauri build`. They
    # resolve to empty on a run that has no secrets configured (and a fork PR
    # never receives them), so the build cleanly falls back to unsigned rather
    # than failing. Only set here — never in the pull_request CI workflow.
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # Import the Developer ID cert into a throwaway keychain so `tauri build`
      # can sign with APPLE_SIGNING_IDENTITY (then notarize + staple). macOS only,
      # and only when signing is configured — otherwise the build stays unsigned.
      - name: Import Apple Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          CERT="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" "login.keychain-db"
          rm -f "$CERT"
      # Tag-driven beta version: strip the leading `v` from the tag, patch
      # package.json to it, then mirror that into Cargo.toml/Cargo.lock. The
      # checkout is ephemeral, so nothing is committed and there is nothing to
      # revert — the built installers carry the tag's version with no manual
      # package.json bump. (vX.Y.Z-beta.N -> X.Y.Z-beta.N.)
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="$VERSION"
          bun run sync-version
      - run: bun scripts/fetch-ffmpeg.ts
      - name: Build app bundle
        run: bun tauri build
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.bundle-glob }} --clobber
